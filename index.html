<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wash POS">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <title>A Plus Car Wash POS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background: #f3f4f6; display: flex; height: 100vh; overflow: hidden; color: #1f2937; }
    
    /* Login Screen Overlay (Glassmorphism) */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(17,24,39,0.95), rgba(31,41,55,0.95)); backdrop-filter: blur(10px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    #loginOverlay h1 { font-weight: 700; font-size: 28px; margin-bottom: 10px; color: #f9fafb; }
    .numpad { display: grid; grid-template-columns: repeat(3, 90px); gap: 24px; margin-top: 10px; }
    .num-btn { width: 90px; height: 90px; font-size: 32px; font-weight: 600; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .num-btn:active { background: #2563eb; transform: scale(0.92); border-color: #2563eb; }
    #pinDisplay { font-size: 60px; letter-spacing: 20px; margin: 15px 0; height: 70px; color: #60a5fa; text-shadow: 0 0 20px rgba(96,165,250,0.4); }
    
    /* Main Layout */
    .menu-section { flex: 1; padding: 30px 40px; overflow-y: auto; display: flex; flex-direction: column; }
    .cart-section { width: 420px; background: #ffffff; margin: 20px 20px 20px 0; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #f3f4f6; }
    
    /* Header Area */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header-title { font-size: 32px; font-weight: 800; color: #111827; letter-spacing: -1px; background: linear-gradient(135deg, #111827, #374151); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .controls { display: flex; gap: 15px; align-items: center; }
    .location-select { padding: 12px 16px; font-size: 15px; border-radius: 12px; border: 1px solid #e5e7eb; background: #fff; font-weight: 600; color: #374151; outline: none; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .attendant-badge { background: #eff6ff; padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 15px; color: #1e3a8a; display: flex; align-items: center; gap: 12px; border: 1px solid #bfdbfe; }
    .logout-btn { background: #fee2e2; color: #b91c1c; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
    .logout-btn:hover { background: #fecaca; }

    /* Service Grid Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding-bottom: 40px; }
    .card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; display: flex; flex-direction: column; justify-content: space-between; height: 100%; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #e5e7eb; transition: 0.3s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border-color: #bfdbfe; }
    .card:hover::before { background: #3b82f6; }
    .card:active { transform: scale(0.97); }
    .card h3 { margin-bottom: 10px; color: #111827; font-size: 20px; font-weight: 700; }
    .card p { color: #6b7280; font-size: 14px; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
    .card .price { display: inline-block; background: #eff6ff; color: #2563eb; padding: 6px 14px; border-radius: 20px; font-size: 18px; font-weight: 700; align-self: flex-start; }

    /* Cart / Receipt Sidebar */
    .cart-header { padding: 24px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
    .cart-title { font-size: 20px; font-weight: 700; color: #111827; display: flex; justify-content: space-between; align-items: center; }
    .cart-items { flex-grow: 1; overflow-y: auto; padding: 24px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; margin-bottom: 12px; background: #f9fafb; border-radius: 16px; border: 1px solid #f3f4f6; }
    .cart-item-name { font-weight: 600; font-size: 15px; color: #1f2937; margin-bottom: 4px; }
    .cart-item-price { color: #6b7280; font-size: 14px; font-weight: 500; }
    .remove-btn { color: #ef4444; border: none; background: #fee2e2; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .remove-btn:hover { background: #fca5a5; color: white; }
    
    /* Cart Footer */
    .cart-footer { padding: 24px; background: white; border-top: 1px solid #e5e7eb; }
    .input-field { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 15px; background: #f9fafb; outline: none; transition: 0.2s; }
    .input-field:focus { border-color: #3b82f6; background: white; box-shadow: 0 0 0 4px #eff6ff; }
    .total-box { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
    .total-label { font-size: 18px; font-weight: 600; color: #6b7280; }
    .total-amount { font-size: 32px; font-weight: 800; color: #111827; }
    
    .submit-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 20px; font-size: 18px; border-radius: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3); }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -3px rgba(16, 185, 129, 0.4); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }
    .status-msg { margin-top: 12px; text-align: center; font-weight: 600; font-size: 14px; height: 20px; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginOverlay">
    <h1>Enter Employee PIN</h1>
    <div id="pinDisplay"></div>
    <div id="loginError" style="color: #fca5a5; height: 20px; font-weight: 600; font-size: 16px;"></div>
    
    <div class="numpad">
      <button class="num-btn" onclick="addPin('1')">1</button>
      <button class="num-btn" onclick="addPin('2')">2</button>
      <button class="num-btn" onclick="addPin('3')">3</button>
      <button class="num-btn" onclick="addPin('4')">4</button>
      <button class="num-btn" onclick="addPin('5')">5</button>
      <button class="num-btn" onclick="addPin('6')">6</button>
      <button class="num-btn" onclick="addPin('7')">7</button>
      <button class="num-btn" onclick="addPin('8')">8</button>
      <button class="num-btn" onclick="addPin('9')">9</button>
      <button class="num-btn" style="background: rgba(239,68,68,0.2); color: #fca5a5; border-color: rgba(239,68,68,0.4);" onclick="clearPin()">C</button>
      <button class="num-btn" onclick="addPin('0')">0</button>
      <button class="num-btn" style="background: rgba(16,185,129,0.2); color: #6ee7b7; border-color: rgba(16,185,129,0.4);" onclick="submitPin()">OK</button>
    </div>
  </div>

  <!-- LEFT: Service Menu -->
  <div class="menu-section">
    <div class="header">
      <h2 class="header-title">WashOS</h2>
      <div class="controls">
        <select id="locationSelect" class="location-select">
          <option value="Location 1 - Tampa Bay">📍 Tampa Bay</option>
          <option value="Location 2 - Columbus">📍 Columbus</option>
          <option value="Location 3 - South">📍 South</option>
          <option value="Location 4 - Armenia1">📍 Armenia</option>
        </select>
        <div class="attendant-badge">
          👤 <span id="currentAttendantName">None</span>
          <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
      </div>
    </div>

    <div class="grid" id="menuGrid"></div>
  </div>

  <!-- RIGHT: Cart / Receipt Sidebar -->
  <div class="cart-section">
    <div class="cart-header">
      <div class="cart-title">
        Current Ticket
        <span style="background: #e5e7eb; padding: 4px 10px; border-radius: 12px; font-size: 13px; color: #4b5563;" id="itemCount">0 items</span>
      </div>
    </div>
    
    <div class="cart-items" id="cartItems"></div>

    <div class="cart-footer">
      <input type="text" id="vehicleInfo" class="input-field" placeholder="🚗 License Plate or Vehicle Model">
      <input type="text" id="orderNotes" class="input-field" placeholder="📝 Additional Notes (Optional)">
      
      <div class="total-box">
        <span class="total-label">Total</span>
        <span class="total-amount" id="grandTotal">$0.00</span>
      </div>
      
      <button id="submitBtn" class="submit-btn" onclick="logOrder()">RECORD SALE</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURATION ---
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7NcEyQG9ELtNt-YKjRXFIzemma-S8uAaA6PPvh8QUDgGX9VkGjBwqDLym6CWwEDgjHQ/exec"; // UPDATE THIS!

    // EMPLOYEE PINS - Add your staff here
    const employees = {
      "1234": "Mike T.",
      "5555": "Sarah J.",
      "9999": "Manager Admin"
    };

    const services = [
      { id: 1, name: "Express Exterior", price: 15.00, desc: "Basic exterior wash, spot-free rinse & air dry." },
      { id: 2, name: "Deluxe Wash", price: 25.00, desc: "Express wash + tire shine, wheel cleaner & underbody wash." },
      { id: 3, name: "Ultimate Shine & Seal", price: 40.00, desc: "Deluxe wash + hot ceramic wax protection & rain repellant." },
      { id: 4, name: "Interior Quick Clean", price: 30.00, desc: "Vacuum seats/mats, console wipe-down & window cleaning." },
      { id: 5, name: "Full Detail Package", price: 85.00, desc: "Ultimate exterior wash + deep interior vacuum, shampoo & leather treatment." },
      { id: 6, name: "Tire & Rim Shine", price: 8.00, desc: "Hand-applied tire dressing & brake dust cleaner." },
      { id: 7, name: "Ceramic Shield", price: 15.00, desc: "Hydrophobic spray sealant layer for multi-week protection." },
      { id: 8, name: "Pet Hair Removal", price: 20.00, desc: "Specialized brush & suction interior pet hair extraction." }
    ];

    // --- 2. STATE VARIABLES ---
    let cart = [];
    let enteredPin = "";
    let activeAttendant = "";

    // --- 3. LOGIN LOGIC ---
    function addPin(num) {
      if(enteredPin.length < 4) {
        enteredPin += num;
        document.getElementById("pinDisplay").innerText = "•".repeat(enteredPin.length);
      }
    }
    
    function clearPin() {
      enteredPin = "";
      document.getElementById("pinDisplay").innerText = "";
      document.getElementById("loginError").innerText = "";
    }

    function submitPin() {
      if (employees[enteredPin]) {
        activeAttendant = employees[enteredPin];
        document.getElementById("currentAttendantName").innerText = activeAttendant;
        document.getElementById("loginOverlay").style.display = "none";
        clearPin();
      } else {
        document.getElementById("loginError").innerText = "Invalid PIN - Try Again";
        enteredPin = "";
        document.getElementById("pinDisplay").innerText = "";
      }
    }

    function logout() {
      activeAttendant = "";
      document.getElementById("currentAttendantName").innerText = "None";
      document.getElementById("loginOverlay").style.display = "flex";
      cart = [];
      updateCart();
    }

    // --- 4. POS LOGIC ---
    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      grid.innerHTML = services.map(item => `
        <div class="card" onclick="addToCart(${item.id})">
          <h3>${item.name}</h3>
          <p>${item.desc}</p>
          <div class="price">$${item.price.toFixed(2)}</div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart.push(services.find(s => s.id === id));
      updateCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      const cartContainer = document.getElementById("cartItems");
      document.getElementById("itemCount").innerText = cart.length === 1 ? "1 item" : cart.length + " items";
      
      if (cart.length === 0) {
        cartContainer.innerHTML = `
          <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 10px;">🛒</div>
            <p>Ticket is empty<br>Select a service to begin</p>
          </div>`;
        document.getElementById("grandTotal").innerText = "$0.00";
        return;
      }
      
      cartContainer.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <div>
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${index})">×</button>
        </div>
      `).join('');
      
      document.getElementById("grandTotal").innerText = `$${cart.reduce((sum, item) => sum + item.price, 0).toFixed(2)}`;
    }

    async function logOrder() {
      if (cart.length === 0) return alert("Please add a service to the ticket first.");
      
      const submitBtn = document.getElementById("submitBtn");
      const statusMsg = document.getElementById("statusMsg");
      
      submitBtn.disabled = true; 
      submitBtn.innerText = "RECORDING...";
      statusMsg.style.color = "#3b82f6"; 
      statusMsg.innerText = "Sending to database...";

      const payload = {
        location: document.getElementById("locationSelect").value,
        orderId: "ORD-" + Math.floor(100000 + Math.random() * 900000),
        services: cart.map(item => item.name).join(", "),
        totalValue: cart.reduce((sum, item) => sum + item.price, 0),
        vehicleInfo: document.getElementById("vehicleInfo").value,
        notes: document.getElementById("orderNotes").value,
        attendant: activeAttendant
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST", mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        statusMsg.style.color = "#10b981"; 
        statusMsg.innerText = "Order logged successfully!";
        
        // Reset everything
        cart = []; 
        document.getElementById("vehicleInfo").value = ""; 
        document.getElementById("orderNotes").value = "";
        updateCart();
        
        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
      } catch (err) {
        statusMsg.style.color = "#ef4444"; 
        statusMsg.innerText = "Network error. Try again.";
      } finally {
        submitBtn.disabled = false; 
        submitBtn.innerText = "RECORD SALE";
      }
    }

    renderMenu();
    updateCart();
  </script>
</body>
</html>
