<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A+ WashOS - Owner Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background: #f3f4f6; color: #1f2937; }
    #pinOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: white; }
    #pinOverlay input { font-size: 24px; padding: 10px; text-align: center; border-radius: 8px; border: none; margin-bottom: 15px; }
    #pinOverlay button { padding: 10px 20px; font-size: 18px; font-weight: bold; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #dashboardContent { padding: 30px; display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
    .chart-container { background: white; padding: 20px; border-radius: 16px; }
    .loc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .loc-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #3b82f6; }
    .loc-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: #1f2937; }
    .badge { background: #e0e7ff; color: #4338ca; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-right: 5px; display: inline-block; margin-bottom: 5px;}
    .list-item { font-size: 14px; color: #4b5563; border-bottom: 1px solid #f3f4f6; padding: 5px 0; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <!-- ADMIN PIN LOCK -->
  <div id="pinOverlay">
    <h2>Owner Access Required</h2>
    <p style="margin-bottom: 20px; color: #9ca3af;">Enter Admin PIN to view financials.</p>
    <input type="password" id="adminPin" placeholder="****">
    <button onclick="checkPin()">Unlock Dashboard</button>
  </div>

  <div id="dashboardContent">
    <div class="header">
      <h1 style="font-weight: 800; font-size: 32px;">📊 Owner Command Center</h1>
      <button style="background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="fetchData()">🔄 Refresh</button>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div style="color: #6b7280; font-weight: bold;">TOTAL SALES</div>
        <div id="kpiSales" style="font-size: 40px; font-weight: 900; color: #10b981;">$0.00</div>
      </div>
      <div class="kpi-card">
        <div style="color: #6b7280; font-weight: bold;">TOTAL CARS</div>
        <div id="kpiCars" style="font-size: 40px; font-weight: 900;">0</div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="chart-container"><canvas id="salesChart"></canvas></div>
      <div class="chart-container"><canvas id="carsChart"></canvas></div>
    </div>

    <h2 style="margin-bottom: 15px;">📍 Location Breakdown</h2>
    <div class="loc-grid" id="locationCards"></div>
  </div>

  <script>
    // ⚠️ PASTE YOUR REAL URL HERE:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJX6GJEcl5OvCZ7Z7JAD72jSK8d7g7EJeK9Ud4dAiDb8-gPidrYvIOGpVAKw8h3Q2VFQ/exec";
    //CODE
    function checkPin() {
      if(document.getElementById('adminPin').value === '3589') {
        document.getElementById('pinOverlay').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        fetchData();
      } else { alert("Incorrect PIN"); document.getElementById('adminPin').value = ''; }
    }

    let salesChart, carsChart;

    async function fetchData() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL + "?action=getDashboardData");
        const data = await response.json();

        document.getElementById("kpiSales").innerText = "$" + data.totalSales.toFixed(2);
        document.getElementById("kpiCars").innerText = data.totalCars;

        const locNames = Object.keys(data.locations);
        const salesData = locNames.map(l => data.locations[l].sales);
        const carsData = locNames.map(l => data.locations[l].cars);

        if(salesChart) salesChart.destroy();
        salesChart = new Chart(document.getElementById('salesChart'), { type: 'bar', data: { labels: locNames, datasets: [{ label: 'Revenue', data: salesData, backgroundColor: '#3b82f6' }] }});
        
        if(carsChart) carsChart.destroy();
        carsChart = new Chart(document.getElementById('carsChart'), { type: 'doughnut', data: { labels: locNames, datasets: [{ data: carsData, backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899'] }] }});

        let locHTML = "";
        locNames.forEach(loc => {
          let lData = data.locations[loc];
          let staff = lData.employees.length > 0 ? lData.employees.map(e => `<span class="badge">👤 ${e}</span>`).join('') : "<span style='color:#9ca3af; font-size: 13px;'>No staff clocked in</span>";
          
          let services = Object.entries(lData.services).sort((a,b) => b[1]-a[1]).map(s => `<div class="list-item"><span>${s[0]}</span><strong>${s[1]}</strong></div>`).join('');
          
          locHTML += `
            <div class="loc-card">
              <div class="loc-title">${loc}</div>
              <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-bottom: 15px;">
                <span style="color:#10b981;">$${lData.sales.toFixed(2)}</span>
                <span>${lData.cars} Cars</span>
              </div>
              <p style="font-size: 12px; font-weight: bold; color: #6b7280; margin-bottom: 5px;">ON CLOCK:</p>
              <div style="margin-bottom: 15px;">${staff}</div>
              <p style="font-size: 12px; font-weight: bold; color: #6b7280; margin-bottom: 5px;">SERVICES RENDERED:</p>
              <div>${services || "<span style='color:#9ca3af; font-size: 13px;'>No services yet</span>"}</div>
            </div>`;
        });
        document.getElementById("locationCards").innerHTML = locHTML;
      } catch (err) { console.error(err); alert("Error loading data."); }
    }
  </script>
</body>
</html>
