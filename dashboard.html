<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A+ WashOS - Live Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Load Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background: #f3f4f6; color: #1f2937; padding: 30px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .title { font-size: 32px; font-weight: 800; color: #111827; }
    .refresh-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .kpi-title { font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 600; }
    .kpi-value { font-size: 42px; font-weight: 800; color: #111827; }
    .kpi-value.green { color: #10b981; }
    
    /* Charts Grid */
    .chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
    .chart-container { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .chart-container h3 { margin-bottom: 15px; color: #374151; }
    
    @media (max-width: 900px) {
      .chart-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">📊 Live Dashboard</h1>
    <button class="refresh-btn" onclick="fetchData()">🔄 Refresh Data</button>
  </div>

  <!-- Top KPI Numbers -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Total Sales Today</div>
      <div class="kpi-value green" id="kpiSales">$0.00</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Total Cars Washed</div>
      <div class="kpi-value" id="kpiCars">0</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="chart-grid">
    <div class="chart-container">
      <h3>Revenue by Location</h3>
      <canvas id="salesChart" height="100"></canvas>
    </div>
    <div class="chart-container">
      <h3>Cars Washed (Volume)</h3>
      <canvas id="carsChart" height="200"></canvas>
    </div>
  </div>

  <script>
    // ⚠️ PASTE YOUR REAL GOOGLE SCRIPT URL HERE:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJX6GJEcl5OvCZ7Z7JAD72jSK8d7g7EJeK9Ud4dAiDb8-gPidrYvIOGpVAKw8h3Q2VFQ/exec";

    let salesChartInstance = null;
    let carsChartInstance = null;

    async function fetchData() {
      const btn = document.querySelector('.refresh-btn');
      btn.innerText = "Loading...";
      
      try {
        // Fetch data from the GET route
        const response = await fetch(GOOGLE_SCRIPT_URL + "?action=getDashboardData");
        const data = await response.json();

        // 1. Update KPIs
        document.getElementById("kpiSales").innerText = "$" + data.totalSales.toFixed(2);
        document.getElementById("kpiCars").innerText = data.totalCars;

        // 2. Prepare Data for Charts
        const locations = Object.keys(data.locations);
        const salesData = locations.map(loc => data.locations[loc].sales);
        const carsData = locations.map(loc => data.locations[loc].cars);

        // 3. Render Sales Bar Chart
        const ctxSales = document.getElementById('salesChart').getContext('2d');
        if (salesChartInstance) salesChartInstance.destroy();
        salesChartInstance = new Chart(ctxSales, {
          type: 'bar',
          data: {
            labels: locations,
            datasets: [{
              label: 'Gross Sales ($)',
              data: salesData,
              backgroundColor: '#3b82f6',
              borderRadius: 6
            }]
          },
          options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // 4. Render Cars Doughnut Chart
        const ctxCars = document.getElementById('carsChart').getContext('2d');
        if (carsChartInstance) carsChartInstance.destroy();
        carsChartInstance = new Chart(ctxCars, {
          type: 'doughnut',
          data: {
            labels: locations,
            datasets: [{
              data: carsData,
              backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899']
            }]
          },
          options: { responsive: true, cutout: '70%' }
        });

      } catch (err) {
        console.error("Dashboard Error:", err);
        alert("Failed to load dashboard data.");
      } finally {
        btn.innerText = "🔄 Refresh Data";
      }
    }

    // Load data instantly when page opens
    window.onload = fetchData;
  </script>
</body>
</html>
