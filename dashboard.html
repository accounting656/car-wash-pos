<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WashOS Live Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background: #f3f4f6; color: #1f2937; -webkit-font-smoothing: antialiased; }
    
    /* Login Lock Screen */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111827; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    #loginOverlay h1 { font-weight: 800; font-size: 24px; margin-bottom: 10px; }
    #pinDisplay { font-size: 50px; letter-spacing: 15px; margin: 20px 0; height: 60px; color: #3b82f6; }
    .numpad { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; }
    .num-btn { width: 80px; height: 80px; font-size: 28px; font-weight: 600; border-radius: 50%; border: 1px solid #374151; background: #1f2937; color: white; cursor: pointer; }
    .num-btn:active { background: #3b82f6; }
    #systemStatus { margin-top: 25px; font-size: 13px; color: #9ca3af; }
    
    /* App Header */
    .header { background: #111827; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header h2 { font-size: 20px; font-weight: 800; }
    .refresh-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    
    /* Global Stats Card */
    .container { padding: 20px; max-width: 800px; margin: 0 auto; }
    .global-stats { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 20px; padding: 25px; color: white; display: flex; justify-content: space-between; margin-bottom: 25px; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
    .stat-box h3 { font-size: 14px; opacity: 0.8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-box .val { font-size: 32px; font-weight: 800; }
    
    /* Location Cards */
    .loc-card { background: white; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
    .loc-header { background: #f9fafb; padding: 15px 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .loc-header h3 { font-size: 16px; font-weight: 800; color: #111827; }
    .loc-metrics { display: flex; gap: 15px; }
    .loc-metric { font-size: 14px; font-weight: 600; background: #eff6ff; color: #1e40af; padding: 4px 10px; border-radius: 8px; }
    
    /* Live Feed */
    .feed { padding: 0 20px; max-height: 250px; overflow-y: auto; }
    .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
    .tx-row:last-child { border-bottom: none; }
    .tx-info { display: flex; flex-direction: column; }
    .tx-time { font-size: 12px; color: #9ca3af; font-weight: 600; margin-bottom: 2px; }
    .tx-service { font-size: 14px; color: #374151; font-weight: 600; }
    .tx-price { font-size: 15px; font-weight: 800; color: #10b981; }
    .no-data { padding: 20px; text-align: center; color: #9ca3af; font-size: 14px; font-weight: 600; }
    
    #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; font-weight: 800; color: #3b82f6; font-size: 18px; }
    .spinner { border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginOverlay">
    <h1>Dashboard Access</h1>
    <div style="font-size: 14px; color: #9ca3af;">Enter Employee or Admin PIN</div>
    <div id="pinDisplay"></div>
    <div id="loginError" style="color: #fca5a5; height: 20px; font-weight: 600;"></div>
    
    <div class="numpad">
      <button class="num-btn" onclick="addPin('1')">1</button>
      <button class="num-btn" onclick="addPin('2')">2</button>
      <button class="num-btn" onclick="addPin('3')">3</button>
      <button class="num-btn" onclick="addPin('4')">4</button>
      <button class="num-btn" onclick="addPin('5')">5</button>
      <button class="num-btn" onclick="addPin('6')">6</button>
      <button class="num-btn" onclick="addPin('7')">7</button>
      <button class="num-btn" onclick="addPin('8')">8</button>
      <button class="num-btn" onclick="addPin('9')">9</button>
      <button class="num-btn" style="background: #374151; color: #fca5a5;" onclick="clearPin()">C</button>
      <button class="num-btn" onclick="addPin('0')">0</button>
      <button class="num-btn" style="background: #10b981; border-color: #059669;" onclick="submitPin()">OK</button>
    </div>
    <div id="systemStatus">🟢 Loading Roster...</div>
  </div>

  <div id="loadingOverlay"><div class="spinner"></div>Syncing Live Data...</div>

<div class="header">
    <div style="display: flex; gap: 15px; align-items: center;">
      <button class="refresh-btn" style="background: #374151; padding: 8px 12px;" onclick="window.location.href='index.html'">⬅ POS</button>
      <h2 id="headerGreeting">WashOS Live</h2>
    </div>
    <button class="refresh-btn" onclick="fetchDashboardData()">🔄 Refresh</button>
  </div>

  <div class="container">
    <div class="global-stats">
      <div class="stat-box">
        <h3>Today's Gross</h3>
        <div class="val" id="globalSales">$0.00</div>
      </div>
      <div class="stat-box" style="text-align: right;">
        <h3>Cars Washed</h3>
        <div class="val" id="globalCars">0</div>
      </div>
    </div>
    
    <div id="locationsContainer">
      <!-- Location cards generated here -->
    </div>
  </div>

  <script>
    // === 1. CONFIGURATION ===
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7NcEyQG9ELtNt-YKjRXFIzemma-S8uAaA6PPvh8QUDgGX9VkGjBwqDLym6CWwEDgjHQ/exec"; // REPLACE THIS
    const ADMIN_PIN = "3589"; // REPLACE WITH YOUR PREFERRED MANAGER PIN
    
    let enteredPin = "";
    let employees = {};
    let isAdmin = false;

    // === LOAD EMPLOYEE PINS ON STARTUP ===
    async function loadAppPins() {
      const statusDiv = document.getElementById("systemStatus");
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const data = await response.json();
        if (data.employees) { employees = data.employees; }
        statusDiv.innerText = "🟢 System Ready";
      } catch (e) {
        statusDiv.innerText = "⚠️ Network Issue (Admin PIN still works)";
      }
    }

    // === LOGIN ===
    function addPin(num) {
      if(enteredPin.length < 4) { 
        enteredPin += num; 
        document.getElementById("pinDisplay").innerText = "•".repeat(enteredPin.length); 
      }
    }
    
    function clearPin() { 
      enteredPin = ""; 
      document.getElementById("pinDisplay").innerText = ""; 
      document.getElementById("loginError").innerText = ""; 
    }
    
    function submitPin() {
      if (enteredPin === ADMIN_PIN) {
        isAdmin = true;
        document.getElementById("headerGreeting").innerText = "Manager Dashboard";
        document.getElementById("loginOverlay").style.display = "none";
        fetchDashboardData();
      } else if (employees[enteredPin]) {
        isAdmin = false;
        document.getElementById("headerGreeting").innerText = "Employee View";
        document.getElementById("loginOverlay").style.display = "none";
        fetchDashboardData();
      } else {
        document.getElementById("loginError").innerText = "Invalid PIN";
        clearPin();
      }
    }

    // === DATA FETCHING ===
    async function fetchDashboardData() {
      document.getElementById("loadingOverlay").style.display = "flex";
      
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL + "?action=getDashboardData");
        const data = await response.json();
        
        // Update Global Stats (Masked if not admin)
        document.getElementById("globalSales").innerText = isAdmin ? "$" + data.totalSales.toFixed(2) : "****";
        document.getElementById("globalCars").innerText = data.totalCars;

        // Build Locations
        const container = document.getElementById("locationsContainer");
        container.innerHTML = "";
        
        Object.keys(data.locations).forEach(loc => {
          const locData = data.locations[loc];
          
          let txHTML = "";
          if (locData.transactions.length === 0) {
            txHTML = `<div class="no-data">No transactions today</div>`;
          } else {
            txHTML = locData.transactions.map(tx => {
              const timeStr = new Date(tx.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
              return `
                <div class="tx-row">
                  <div class="tx-info">
                    <span class="tx-time">${timeStr} | ${tx.orderId}</span>
                    <span class="tx-service">${tx.services}</span>
                  </div>
                  <div class="tx-price">$${tx.total.toFixed(2)}</div>
                </div>
              `;
            }).join('');
          }

          // Format the Location Sales Badge (Masked if not admin)
          const locSalesDisplay = isAdmin ? `$${locData.sales.toFixed(2)}` : '****';

          container.innerHTML += `
            <div class="loc-card">
              <div class="loc-header">
                <h3>${loc.replace('Location ', '').replace(' - ', ' ')}</h3>
                <div class="loc-metrics">
                  <span class="loc-metric">🚗 ${locData.cars}</span>
                  <span class="loc-metric" style="background: #d1fae5; color: #065f46;">${locSalesDisplay}</span>
                </div>
              </div>
              <div class="feed">${txHTML}</div>
            </div>
          `;
        });
      } catch (err) {
        alert("Failed to sync data. Please check your internet connection.");
      } finally {
        document.getElementById("loadingOverlay").style.display = "none";
      }
    }

    // Start loading PINs immediately
    loadAppPins();
  </script>
</body>
</html>
