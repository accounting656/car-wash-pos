<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A+ WashOS - Mobile Timeclock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f3f4f6; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
    }
    .card { 
      background: white; 
      padding: 30px 20px; 
      border-radius: 16px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
    }
    h2 { margin-top: 0; color: #1f2937; font-size: 24px; margin-bottom: 5px; }
    .loc-badge { color: #3b82f6; font-size: 14px; font-weight: bold; margin-bottom: 25px; display: block; }
    
    input { 
      width: 100%; 
      padding: 16px; 
      margin-bottom: 20px; 
      border-radius: 10px; 
      border: 1px solid #d1d5db; 
      font-size: 16px; 
      box-sizing: border-box; 
      background: #f9fafb;
      text-align: center;
    }
    
    input[type="password"] {
      letter-spacing: 5px;
      font-size: 24px;
      font-weight: bold;
    }
    
    .btn-group { display: flex; gap: 15px; margin-top: 10px; }
    button { 
      flex: 1; 
      padding: 18px 10px; 
      font-size: 18px; 
      font-weight: 800; 
      border: none; 
      border-radius: 10px; 
      color: white; 
      cursor: pointer; 
      transition: 0.2s;
    }
    .btn-in { background: #10b981; }
    .btn-in:active { background: #059669; }
    .btn-out { background: #ef4444; }
    .btn-out:active { background: #dc2626; }
    
    #statusMessage { margin-top: 20px; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card" id="clockForm">
    <h2>⏱️ A+ WashOS</h2>
    <span class="loc-badge" id="locationDisplay">Loading Location...</span>
    
    <input type="password" id="employeePin" placeholder="Enter PIN" inputmode="numeric" pattern="[0-9]*" required>
    
    <div class="btn-group">
      <button class="btn-in" onclick="submitPunch('Clock In')">Clock In</button>
      <button class="btn-out" onclick="submitPunch('Clock Out')">Clock Out</button>
    </div>
    
    <div id="statusMessage"></div>
  </div>

  <script>
    // ⚠️ PASTE YOUR REAL URL HERE:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJX6GJEcl5OvCZ7Z7JAD72jSK8d7g7EJeK9Ud4dAiDb8-gPidrYvIOGpVAKw8h3Q2VFQ/exec";

    // Extract location from the URL (e.g., ?loc=tampa)
    const urlParams = new URLSearchParams(window.location.search);
    const locKey = urlParams.get('loc');
    
    const locMap = {
      "tampa": "Location 1 - Tampa Bay",
      "columbus": "Location 2 - Columbus",
      "south": "Location 3 - South",
      "armenia": "Location 4 - Armenia"
    };

    const actualLocation = locMap[locKey];

    if (!actualLocation) {
      document.getElementById("clockForm").innerHTML = "<h2>❌ Invalid QR Code</h2><p style='color: #6b7280; margin-top: 10px;'>Please scan a valid location QR code.</p>";
    } else {
      document.getElementById("locationDisplay").innerText = actualLocation;
    }

    async function submitPunch(action) {
      if (!actualLocation) return;
      
      const pin = document.getElementById("employeePin").value.trim();
      
      if (!pin) { 
        alert("Please enter your PIN."); 
        return; 
      }
      
      const statusDiv = document.getElementById("statusMessage");
      statusDiv.style.color = "#3b82f6";
      statusDiv.innerText = "⏳ Verifying...";

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            recordType: "timeclock",
            location: actualLocation,
            pin: pin,
            action: action
          })
        });

        const result = await response.json();
        
        if (result.status === "success") {
           const resolvedName = result.name; 
           const actionText = action === 'Clock In' ? 'Signed in' : 'Signed out';
           
           document.getElementById("clockForm").innerHTML = `
             <h1 style="color: #10b981; font-size: 70px; margin: 0 0 10px 0;">✅</h1>
             <h2 style="margin-bottom: 10px;">${resolvedName}</h2>
             <p style="font-size: 20px; color: #111827; font-weight: bold;">Successfully ${actionText}</p>
           `;
           
           setTimeout(() => {
             window.close();
             document.getElementById("clockForm").innerHTML += `<p style="color: #6b7280; margin-top: 25px; font-size: 14px;">You may safely close this screen.</p>`;
           }, 2500);

        } else {
           statusDiv.style.color = "#ef4444";
           statusDiv.innerText = "❌ " + result.message;
        }
      } catch (err) {
        statusDiv.style.color = "#ef4444";
        statusDiv.innerText = "❌ Network connection failed.";
      }
    }
  </script>
</body>
</html>
